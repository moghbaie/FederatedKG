[project]
name = "federatedkg-dev"
version = "0.1.0"
description = "Host-side test and tooling environment for the FederatedKG MVP"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pytest==8.3.4",
    "rdflib==7.1.1",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    # registry, for in-process API tests
    "fastapi==0.115.6",
    "sqlalchemy==2.0.36",
    "pyjwt==2.10.1",
    "alembic==1.14.0",
    "cryptography==44.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests need `docker compose up --wait`; select them explicitly with `-m live`.
addopts = "-m 'not live'"
markers = ["live: requires the running Docker Compose stack"]
