server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://registry:8000/;
    proxy_set_header Host $host;
  }

  # Owner-only "My KG": the browser talks to *its own* agent; the agent checks that the
  # registry-signed user token's subject is its persona. Only /owner/* is proxied.
  location = /agent/persona_a/owner/graph { proxy_pass http://agent_a:8000/owner/graph; }
  location = /agent/persona_b/owner/graph { proxy_pass http://agent_b:8000/owner/graph; }
  location = /agent/persona_c/owner/graph { proxy_pass http://agent_c:8000/owner/graph; }
  location = /agent/persona_d/owner/graph { proxy_pass http://agent_d:8000/owner/graph; }
  location /agent/ { return 404; }

  location / {
    try_files $uri /index.html;
  }
}
